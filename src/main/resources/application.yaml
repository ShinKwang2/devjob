spring:
  application:
    name: devjob

  profiles:
    default: dev

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024 # 1KB 이상 응답만 압축