spring:
  application:
    name: devjob

  datasource:
    url: jdbc:postgresql://localhost:15432/devjob
    username: devjob
    password: devjob
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false


server:
  port: 8888


jwt:
  secret: "devjob-portfolio-jwt-secret-key-please-change-this-in-production-1234567890"
  expiration:  3600000